name: Auto-Version & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Reject stale main pushes atomically and never interrupt an active release.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate the next version
        id: version
        shell: powershell
        env:
          PUSH_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $template = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'Source\App.ps1'))
          $match = [regex]::Match($template, '(?m)^\$Global:ScriptVersion\s*=\s*"(\d+\.\d+\.\d+)"\s*$')
          if (-not $match.Success) { throw 'No numeric version was found in Source/App.ps1.' }
          $current = [Version]$match.Groups[1].Value
          $tag = 'v' + $current.ToString()
          git rev-parse --verify --quiet "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            # Include unreleased commits from superseded or documentation-only pushes.
            $messages = (git log "$tag..HEAD" --format=%B) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw 'Could not read unreleased commits.' }
          } else {
            $messages = (($env:PUSH_MESSAGES | ConvertFrom-Json) -join "`n")
          }
          $major = $current.Major; $minor = $current.Minor; $patch = $current.Build
          if ($messages.Contains('BREAKING:')) { $major++; $minor = 0; $patch = 0 }
          elseif ($messages.Contains('feat:')) { $minor++; $patch = 0 }
          elseif ($messages.Contains('fix:')) { $patch++ }
          $next = "$major.$minor.$patch"
          $changed = ($next -ne $current.ToString()).ToString().ToLowerInvariant()
          @("changed=$changed", "number=$next") | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # A missing previous tag is an expected first-release case.
          $global:LASTEXITCODE = 0

      - name: Validate the source and run Windows regression checks
        shell: powershell
        run: .\Build.ps1 -SkipCompile

      - name: Version the template and build release assets
        if: steps.version.outputs.changed == 'true'
        shell: powershell
        env:
          NEW_VERSION: ${{ steps.version.outputs.number }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = (git ls-remote --heads origin main)
          if ($LASTEXITCODE -ne 0 -or ($remote -split '\s+')[0] -ne $env:EXPECTED_HEAD) {
            throw 'main moved while validation was running; the newer queued push will handle the release.'
          }
          $templatePath = Join-Path $env:GITHUB_WORKSPACE 'Source\App.ps1'
          $template = [IO.File]::ReadAllText($templatePath)
          $template = [regex]::Replace($template, '(?m)^(\$Global:ScriptVersion\s*=\s*")\d+\.\d+\.\d+("\s*)$', ('${1}' + $env:NEW_VERSION + '${2}'))
          [IO.File]::WriteAllText($templatePath, $template, (New-Object Text.UTF8Encoding($true)))
          # Only the numeric version changed after the preceding test gate.
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'qBitLauncher-release'
          .\Build.ps1 -SkipTests -OutputPath (Join-Path $releaseDirectory 'qBitLauncher.exe')

      - name: Commit version and atomically push its tag
        if: steps.version.outputs.changed == 'true'
        shell: powershell
        env:
          NEW_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v' + $env:NEW_VERSION
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git add -- Source/App.ps1 qBitLauncher.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the versioned source.' }
          git commit -m "chore: bump version to $env:NEW_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the version.' }
          git tag $tag
          if ($LASTEXITCODE -ne 0) { throw 'The release tag already exists or could not be created.' }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'The atomic release push was rejected; no release was published.' }

      - name: Publish the verified release
        if: steps.version.outputs.changed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'qBitLauncher-release'
          $assets = @('qBitLauncher.exe', 'qBitLauncher.ps1', 'SHA256SUMS.txt') | ForEach-Object { Join-Path $releaseDirectory $_ }
          foreach ($asset in $assets) { if (-not [IO.File]::Exists($asset)) { throw "Missing release asset: $asset" } }
          gh release create ("v" + $env:NEW_VERSION) @assets --verify-tag --latest --title ("Release v" + $env:NEW_VERSION) --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
